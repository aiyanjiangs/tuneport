[package]
name = "tuneport"
version = "1.0.0"
edition = "2021"
description = "音乐转换"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tuneport-core = { path = "../core-rs" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
